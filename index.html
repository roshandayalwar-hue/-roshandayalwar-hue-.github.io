<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Account Management System</title>
<style>
  :root {
    --bg:#f4f6fb; --card:#ffffff; --text:#1c2333; --muted:#6b7488; --border:#dde2ee;
    --primary:#2f5bea; --primary-text:#ffffff; --ok:#1a7f4b; --err:#c62828; --row:#eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161f; --card:#1b212d; --text:#e8ecf5; --muted:#98a1b5; --border:#2c3445;
            --primary:#6b8cff; --primary-text:#0d1220; --ok:#4cc38a; --err:#ff7b7b; --row:#252d40; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); padding:24px 16px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  label { display:flex; flex-direction:column; font-size:.8rem; color:var(--muted); gap:4px; }
  input, select { padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:.95rem; min-width:130px; }
  button { padding:9px 14px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; font-size:.9rem; }
  button:hover { border-color:var(--primary); }
  button.primary { background:var(--primary); color:var(--primary-text); border-color:var(--primary); font-weight:600; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th, td { text-align:left; padding:10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:.8rem; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tbody tr { cursor:pointer; }
  tbody tr:hover, tbody tr.sel { background:var(--row); }
  .empty { color:var(--muted); text-align:center; padding:20px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); padding:12px 18px; border-radius:10px; color:#fff; display:none; max-width:90vw; white-space:pre-line; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:10; }
  #toast.ok { background:var(--ok); } #toast.err { background:var(--err); }
  dialog { border:1px solid var(--border); border-radius:12px; background:var(--card); color:var(--text); max-width:620px; width:92vw; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  pre { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.8rem; overflow-x:auto; margin:0 0 12px; white-space:pre; max-height:50vh; overflow-y:auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bank Account Management System</h1>
  <p class="sub">Savings (min balance 500, 4% interest) and Current (overdraft 5000, no interest) accounts.</p>

  <div class="card">
    <h2>Create New Account</h2>
    <div class="row">
      <label>Holder Name <input id="name" type="text"></label>
      <label>Type <select id="type"><option>Savings</option><option>Current</option></select></label>
      <label>Initial Deposit <input id="initial" type="number" min="0" step="0.01"></label>
      <button class="primary" id="createBtn">Create Account</button>
    </div>
  </div>

  <div class="card">
    <h2>Accounts</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Account No</th><th>Holder</th><th>Type</th><th class="num">Balance</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>Transactions</h2>
    <div class="row">
      <label>Account No <input id="accNo" type="text" placeholder="ACC1001"></label>
      <label>Amount <input id="amount" type="number" min="0" step="0.01"></label>
      <button id="depositBtn">Deposit</button>
      <button id="withdrawBtn">Withdraw</button>
      <button id="interestBtn">Apply Interest</button>
      <button id="historyBtn">History</button>
    </div>
    <div class="row" style="margin-top:12px">
      <label>Transfer To <input id="toAcc" type="text" placeholder="ACC1002"></label>
      <button id="transferBtn">Transfer</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <h2 style="margin-top:0;font-size:1.1rem">Transaction History</h2>
  <pre id="dlgText"></pre>
  <button class="primary" id="dlgClose">Close</button>
</dialog>
<div id="toast"></div>

<script>
// ===== Custom exceptions =====
class InsufficientFundsException extends Error {}
class InvalidAmountException extends Error {}
class AccountNotFoundException extends Error {}

// ===== Abstract class (Account) =====
class Account {
  #accountNumber; #holderName; #history = [];
  constructor(accountNumber, holderName, initialBalance) {
    if (new.target === Account) throw new TypeError("Account is abstract and cannot be instantiated.");
    this.#accountNumber = accountNumber;
    this.#holderName = holderName;
    this.balance = initialBalance;
    this.log("Opening", initialBalance);
  }
  get accountNumber() { return this.#accountNumber; }
  get holderName()    { return this.#holderName; }
  get history()       { return this.#history; }

  deposit(amount) {
    if (!(amount > 0)) throw new InvalidAmountException("Deposit amount must be greater than zero.");
    this.balance += amount;
    this.log("Deposit", amount);
  }
  // Abstract methods - subclasses must override
  withdraw(amount)   { throw new Error("withdraw() must be overridden"); }
  calculateInterest(){ throw new Error("calculateInterest() must be overridden"); }
  get accountType()  { throw new Error("accountType must be overridden"); }

  applyInterest() {
    const interest = this.calculateInterest();
    if (interest > 0) { this.balance += interest; this.log("Interest", interest); }
  }
  log(type, amount) {
    this.#history.push(`${type.padEnd(10)} ${amount.toFixed(2).padStart(12)}   | Balance: ${this.balance.toFixed(2)}`);
  }
  toString() {
    return `${this.accountType} [${this.accountNumber}, ${this.holderName}, Balance: ${this.balance.toFixed(2)}]`;
  }
}

// ===== Inheritance + method overriding =====
class SavingsAccount extends Account {
  static MIN_BALANCE = 500;
  static INTEREST_RATE = 0.04;
  withdraw(amount) {
    if (!(amount > 0)) throw new InvalidAmountException("Withdrawal amount must be greater than zero.");
    if (this.balance - amount < SavingsAccount.MIN_BALANCE) {
      throw new InsufficientFundsException(
        `Savings account must keep a minimum balance of ${SavingsAccount.MIN_BALANCE}.\nAvailable to withdraw: ` +
        Math.max(0, this.balance - SavingsAccount.MIN_BALANCE).toFixed(2));
    }
    this.balance -= amount;
    this.log("Withdraw", amount);
  }
  calculateInterest() { return this.balance * SavingsAccount.INTEREST_RATE; }
  get accountType() { return "Savings"; }
  toString() { return super.toString() + ` (Min Balance: ${SavingsAccount.MIN_BALANCE})`; }
}

class CurrentAccount extends Account {
  static OVERDRAFT_LIMIT = 5000;
  withdraw(amount) {
    if (!(amount > 0)) throw new InvalidAmountException("Withdrawal amount must be greater than zero.");
    if (this.balance + CurrentAccount.OVERDRAFT_LIMIT < amount) {
      throw new InsufficientFundsException(`Overdraft limit of ${CurrentAccount.OVERDRAFT_LIMIT} exceeded.`);
    }
    this.balance -= amount;
    this.log("Withdraw", amount);
  }
  calculateInterest() { return 0; }
  get accountType() { return "Current"; }
  toString() { return super.toString() + ` (Overdraft: ${CurrentAccount.OVERDRAFT_LIMIT})`; }
}

// ===== Bank (Map keeps insertion order, like LinkedHashMap) =====
class Bank {
  #accounts = new Map();
  #nextNumber = 1001;
  createAccount(type, holder, initial) {
    if (!holder || !holder.trim()) throw new InvalidAmountException("Account holder name cannot be empty.");
    if (initial < 0) throw new InvalidAmountException("Initial deposit cannot be negative.");
    if (type === "Savings" && initial < 500) throw new InvalidAmountException("Savings account needs at least 500 to open.");
    const accNo = "ACC" + this.#nextNumber++;
    const acc = type === "Savings" ? new SavingsAccount(accNo, holder.trim(), initial)
                                   : new CurrentAccount(accNo, holder.trim(), initial);
    this.#accounts.set(accNo, acc);
    return acc;
  }
  findAccount(accNo) {
    const acc = this.#accounts.get(accNo.trim().toUpperCase());
    if (!acc) throw new AccountNotFoundException("No account found with number: " + accNo);
    return acc;
  }
  transfer(fromNo, toNo, amount) {
    const from = this.findAccount(fromNo), to = this.findAccount(toNo);
    if (from === to) throw new InvalidAmountException("Cannot transfer to the same account.");
    from.withdraw(amount);
    to.deposit(amount);
  }
  get allAccounts() { return [...this.#accounts.values()]; }
}

// ===== UI =====
const bank = new Bank();
const $ = id => document.getElementById(id);
let toastTimer;

function toast(msg, ok) {
  const t = $("toast");
  t.textContent = msg; t.className = ok ? "ok" : "err"; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", 3500);
}
const info = m => toast(m, true), error = m => toast(m, false);

function parseAmount() {
  const v = $("amount").value.trim();
  if (v === "" || isNaN(Number(v))) throw new TypeError("Please enter a valid amount.");
  return Number(v);
}

// Single try/catch wrapper: all bank exceptions show as an error message
function run(fn) {
  try { fn(); }
  catch (ex) {
    if (ex instanceof InvalidAmountException || ex instanceof AccountNotFoundException ||
        ex instanceof InsufficientFundsException || ex instanceof TypeError) error(ex.message);
    else { console.error(ex); error("Unexpected error: " + ex.message); }
  }
}

function refreshTable() {
  const tb = $("tbody"), sel = $("accNo").value.trim().toUpperCase();
  tb.innerHTML = "";
  const list = bank.allAccounts;
  if (!list.length) { tb.innerHTML = '<tr><td colspan="4" class="empty">No accounts yet. Create one above.</td></tr>'; return; }
  for (const a of list) {
    const tr = document.createElement("tr");
    if (a.accountNumber === sel) tr.className = "sel";
    for (const [i, v] of [a.accountNumber, a.holderName, a.accountType, a.balance.toFixed(2)].entries()) {
      const td = document.createElement("td");
      td.textContent = v; if (i === 3) td.className = "num";
      tr.appendChild(td);
    }
    tr.onclick = () => { $("accNo").value = a.accountNumber; refreshTable(); };
    tb.appendChild(tr);
  }
}

$("createBtn").onclick = () => run(() => {
  const v = $("initial").value.trim();
  if (v === "" || isNaN(Number(v))) throw new TypeError("Please enter a valid number for the initial deposit.");
  const acc = bank.createAccount($("type").value, $("name").value, Number(v));
  refreshTable();
  info("Account created successfully!\nAccount Number: " + acc.accountNumber);
  $("name").value = ""; $("initial").value = "";
});

$("depositBtn").onclick = () => run(() => {
  const acc = bank.findAccount($("accNo").value);
  acc.deposit(parseAmount());
  refreshTable(); info("Deposit successful.\nNew balance: " + acc.balance.toFixed(2));
});

$("withdrawBtn").onclick = () => run(() => {
  const acc = bank.findAccount($("accNo").value);
  acc.withdraw(parseAmount());   // polymorphism: runtime type decides the rules
  refreshTable(); info("Withdrawal successful.\nNew balance: " + acc.balance.toFixed(2));
});

$("transferBtn").onclick = () => run(() => {
  bank.transfer($("accNo").value, $("toAcc").value, parseAmount());
  refreshTable(); info("Transfer successful.");
});

$("interestBtn").onclick = () => run(() => {
  const acc = bank.findAccount($("accNo").value);
  const before = acc.balance;
  acc.applyInterest();           // calls the overridden calculateInterest()
  refreshTable();
  info(`${acc.accountType} account interest added: ${(acc.balance - before).toFixed(2)}`);
});

$("historyBtn").onclick = () => run(() => {
  const acc = bank.findAccount($("accNo").value);
  $("dlgText").textContent = acc.toString() + "\n\n" + acc.history.join("\n");
  $("dlg").showModal();
});
$("dlgClose").onclick = () => $("dlg").close();
$("accNo").addEventListener("input", refreshTable);

refreshTable();
</script>
</body>
</html>
